  /* Header */

  .btn.ghost{color:var(--blue-ink);background:transparent}
  .btn.ghost:hover{background:var(--blue-soft)}
  .btn.cta{min-height:3.5rem;padding:0 1.9rem 0 1.5rem;gap:.7rem;font-size:1.125rem;background:var(--blue);border-color:var(--blue);color:var(--ink);box-shadow:0 10px 24px -14px rgba(42,46,82,.55);transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease),box-shadow .25s}
  .btn.cta:hover{background:var(--blue-ink);border-color:var(--blue-ink);color:#fff;transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(42,46,82,.7)}
  .btn.cta:active{transform:translateY(0)}

  .btn.cta.sketch:hover .pencil .squiggle,.btn.cta.sketch:focus-visible .pencil .squiggle{animation:squig .6s var(--ease)}
  @keyframes squig{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .btn.cta:hover .pencil{transform:rotate(-12deg) translateX(-2px)}
  /* Sketch state: hand-drawn outline that turns into a solid button on hover or keyboard focus */
  .btn.cta.sketch{position:relative;isolation:isolate;background:transparent;border-color:transparent;box-shadow:none;color:var(--ink)}
  .btn.cta.sketch>*{position:relative;z-index:1}
  .btn.cta.sketch [data-i18n]{font-family:"Architects Daughter","Segoe Print","Bradley Hand",cursive;font-size:1.3rem;font-weight:400;letter-spacing:.015em;line-height:1;transform:translateY(1px)}
  .btn.cta.sketch .sk{position:absolute;inset:-5px -7px;width:calc(100% + 14px);height:calc(100% + 10px);fill:none;stroke:var(--blue-ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible;z-index:0;pointer-events:none;animation:skIn 1.1s 1.5s var(--ease) both}
  .btn.cta.sketch .sk path{stroke-dasharray:1 1;stroke-dashoffset:0;transition:stroke .3s,opacity .3s}
  .btn.cta.sketch .sk .skfill{stroke:none;stroke-dasharray:none;fill:var(--blue-ink);opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.94,.8);transition:opacity .3s var(--ease),transform .4s var(--ease)}
  .btn.cta.sketch .sk .sk2{stroke-width:1;opacity:.55}

  .btn.cta.sketch::after{content:"";position:absolute;left:6%;right:6%;bottom:-2px;height:60%;border-radius:50%;background:rgba(42,46,82,.45);filter:blur(12px);opacity:0;z-index:-1;transition:opacity .35s var(--ease)}
  .btn.cta.sketch:hover::after,.btn.cta.sketch:focus-visible::after{opacity:1}
  .btn.cta.sketch:hover .sk path:not(.skfill),.btn.cta.sketch:focus-visible .sk path:not(.skfill){stroke:var(--ink)}

  html.vt-lang .card{view-transition-name:none!important}

  /* About */
  .about{border-top:1px solid var(--rule)}
  .cols{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s3)}
  .about .side{grid-column:1 / span 4}
  .about .body{grid-column:6 / span 7}
  .portrait{width:min(240px,60%);aspect-ratio:3/4;object-fit:cover;margin-top:var(--s4);filter:grayscale(1)}
  .about .intro{font-size:clamp(1.2rem,2vw,1.45rem);line-height:1.45;margin:0 0 var(--s4);max-width:40ch}
  .about h3{font-size:1.25rem;font-weight:500;margin:var(--s5) 0 var(--s2)}
  .about h3:first-of-type{margin-top:0}
  .timeline{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .timeline li{display:grid;grid-template-columns:10.5rem 1fr;gap:var(--s2);padding:1.1rem 0;border-bottom:1px solid var(--rule)}
  .timeline .when{color:var(--blue-ink);font-weight:500;font-size:.9375rem;font-variant-numeric:tabular-nums}
  .timeline b{display:block;font-weight:600}
  .timeline .what{display:block;color:var(--stone);font-size:.9375rem}
  .timeline p{margin:.35rem 0 0;max-width:60ch}
  dl.facts{display:grid;grid-template-columns:minmax(8rem,11rem) 1fr;margin:0;border-top:1px solid var(--rule)}
  dl.facts dt,dl.facts dd{padding:.85rem 0;border-bottom:1px solid var(--rule);margin:0}
  dl.facts dt{color:var(--stone);padding-right:var(--s2)}
  h2::after{content:"";display:block;width:2.5rem;height:3px;background:var(--blue);margin-top:1rem}
  .info h2::after,.sheet h2::after{display:none}

  /* Contact */
  .contact{background:var(--blue-deep);color:#fff;position:relative;overflow:hidden}
  .contact::before{content:"";position:absolute;inset:auto -10% -60% auto;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(134,140,182,.35),transparent);pointer-events:none}
  .contact .wrap{position:relative}
  .contact h2{margin-bottom:var(--s4)}
  .contact .email{display:inline-block;font-family:var(--display);font-weight:500;font-size:clamp(1.75rem,6vw,5rem);line-height:1.1;letter-spacing:-.025em;text-decoration:none;overflow-wrap:anywhere;padding-bottom:.1em;
    background:linear-gradient(#fff,#fff) left bottom/0% 2px no-repeat,linear-gradient(var(--blue-light),var(--blue-light)) left bottom/100% 2px no-repeat;transition:background-size .6s var(--ease)}
  .contact .email:hover{background-size:100% 2px,100% 2px}
  .contact .email{min-height:1.1em;min-width:10ch}
  .nojs{margin:.5rem 0 0;color:var(--blue-light)}
  .contact .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:var(--s3);margin-top:var(--s5);color:var(--blue-light)}
  .contact h2::after{background:var(--blue-light)}
  .contact .details p{margin:0}
  .contact .details a{color:#fff}
  .contact :focus-visible{outline-color:#fff}

  footer{background:var(--blue-deep);color:#AEB5DD;padding:0 0 2.5rem}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s2);border-top:1px solid #2E387A;padding-top:2rem}
  footer .lockup{color:#fff}
  footer .mark{width:22px;height:22px}
  .flinks{display:flex;align-items:center;gap:var(--s3);margin:0;padding:0;list-style:none}
  .flink{display:inline-flex;align-items:center;height:2.75rem;margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;font-size:.875rem;line-height:1;text-decoration:none;cursor:pointer;transition:color .2s}
  button.flink:hover{color:#fff;text-decoration:underline;text-underline-offset:.25em}

  /* Project dialog */
  dialog{border:0;padding:0;width:100%;max-width:min(1200px,96vw);max-height:94vh;background:var(--sheet);color:var(--ink);overscroll-behavior:contain}
  dialog.small{max-width:min(640px,94vw)}
  dialog::backdrop{background:rgba(23,28,51,.6);backdrop-filter:blur(4px)}
  dialog[open]{animation:open .35s var(--ease)}
  @keyframes open{from{opacity:0;transform:translateY(16px) scale(.985)}}
  .sheet{padding:clamp(1.5rem,4vw,3.5rem)}
  .topbar{position:sticky;top:0;display:flex;justify-content:flex-end;margin:calc(-1 * clamp(1.5rem,4vw,3.5rem)) calc(-1 * clamp(1.5rem,4vw,3.5rem)) 0;padding:1rem;z-index:2;pointer-events:none}
  .topbar .close{pointer-events:auto;margin:0;background:rgba(255,255,255,.92)}
  .sheet .kind{margin:0 0 .5rem;color:var(--blue-ink);font-weight:500}
  .sheet h2{font-size:clamp(1.9rem,4vw,3.25rem);max-width:22ch;line-height:1.02}
  .sheet .subtitle{margin:.75rem 0 0;color:var(--stone);max-width:60ch}
  .dbody{display:grid;grid-template-columns:3fr 2fr;gap:clamp(1.5rem,4vw,3.5rem);margin-top:var(--s4)}
  .dtext p{margin:0 0 1.1rem;max-width:62ch}
  .dbody dl.facts{align-self:start}
  .dlead{margin:var(--s4) 0 0}.dlead img{width:100%;height:auto;max-height:70vh;object-fit:contain;background:var(--concrete)}.dlead figcaption{margin-top:.5rem;color:var(--stone);font-size:.875rem}
  .dtext h3{font-size:1.1rem;font-weight:600;margin:var(--s3) 0 .4rem}
  .dtext .credits{color:var(--stone);font-size:.9375rem}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,2vw,1.5rem);margin-top:var(--s5)}
  .gallery figure{margin:0}
  .gallery figure.full{grid-column:1 / -1}
  .gallery img{width:100%;height:auto;background:var(--concrete)}
  .gallery figcaption{margin-top:.5rem;color:var(--stone);font-size:.875rem}
  .info{padding:clamp(1.5rem,3vw,2.75rem)}
  .info h2{font-size:clamp(1.75rem,3vw,2.4rem);margin:0 0 1.25rem}
  .info>p{margin:0 0 var(--s3);max-width:48ch}
  .close{font:inherit;font-size:.9375rem;margin-top:var(--s4);min-height:2.5rem;background:none;border:1px solid var(--blue);color:var(--blue-ink);padding:0 1.2rem;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .close:hover{background:var(--blue)!important;color:var(--ink)}

  @supports (animation-timeline: view()){
    @media (prefers-reduced-motion:no-preference){
      .card{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
      .card .plate{animation:unveil linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
      .reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 20%}
    }
  }
  @keyframes reveal{from{opacity:0;transform:translateY(48px)}}
  @keyframes unveil{from{clip-path:inset(22% 0 0 0)}to{clip-path:inset(0 0 0 0)}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
  @media (max-width:860px){
    .hero-text .lead,.hero-text .aside,.about .side,.about .body{grid-column:1 / -1}
    .dbody,.gallery{grid-template-columns:1fr}
    dl.facts,.timeline li{grid-template-columns:1fr}
    dl.facts dt{border-bottom:0;padding-bottom:0}

    .timeline li{gap:.2rem}
  }
  @media (max-width:640px){ header.site .ltxt{display:none} }
  @media (max-width:420px){ nav ul{gap:.85rem} .langs{padding-left:.6rem} .langs button{min-width:2rem} }
  /* Windows high-contrast / forced colours: keep selected states and outlines visible */
  @media (forced-colors:active){

  }
  @media (max-width:380px){ header.site .wrap{gap:.5rem} .right{gap:.6rem} nav ul{gap:.65rem} nav a{font-size:.8125rem} .langs{padding-left:.45rem;gap:0} .langs button{min-width:1.75rem;padding:0 .2rem;font-size:.75rem} }
</style>

 {id:"kamen",tags:["academic"],kind:"masters",cover:"01-hero",
  title:{en:"Research Centre for Alpine Rivers and the Revitalisation of Kamen Castle",de:"Forschungszentrum für alpine Fließgewässer und Revitalisierung der Burgruine Kamen",sl:"Raziskovalni center za alpske vodotoke in revitalizacija razvaline gradu Kamen"},

  context:{en:"Faculty of Architecture, University of Ljubljana",de:"Fakultät für Architektur, Universität Ljubljana",sl:"Fakulteta za arhitekturo, Univerza v Ljubljani"},
  text:{en:["Kamen Castle is a medieval ruin that grew over several phases and periods. It is open to the public but offers no coherent experience, and part of it is fenced off because of rockfall. The thesis analyses its current state and the conservation work carried out since the second half of the 20th century, and proposes stabilising the walls of the castle and its manor farm, new targeted interventions, and embedding a programme within the ruin.","On the terraces of two former farm buildings, a small research centre for analysing field samples from alpine rivers creates a new connection between the lower and upper parts of the ruin and improves access. The manor farm, once a mill, holds the entrance and a café. A park and an events area complete the revitalisation."],
        de:["Die Burg Kamen ist eine mittelalterliche, über mehrere Phasen und Epochen gewachsene Ruine. Sie ist öffentlich zugänglich, bietet aber kein ganzheitliches Erlebnis, und ein Teil ist wegen Steinschlags umzäunt. Die Arbeit analysiert den Ist-Zustand und die konservatorisch-restauratorischen Eingriffe seit der zweiten Hälfte des 20. Jahrhunderts und schlägt die Stabilisierung der Mauern von Burg und Meierhof, neue punktuelle Interventionen und die Einbettung eines Programms in die Ruine vor.","Auf den Terrassen zweier ehemaliger Wirtschaftsgebäude liegt ein kleines Forschungszentrum zur Analyse von Feldproben alpiner Fließgewässer. Es schafft eine neue Verbindung zwischen dem unteren und dem oberen Teil der Ruine und verbessert ihre Zugänglichkeit. Im Meierhof, einst eine Mühle, befinden sich Eingang und Café. Eine Parkanlage und ein Veranstaltungsbereich ergänzen die Revitalisierung."],
        sl:["Grad Kamen je srednjeveška razvalina, ki je rasla skozi več faz in obdobij. Javno je dostopna, vendar ne ponuja celostnega doživetja, del pa je zaradi padajočega kamenja ograjen. Naloga analizira obstoječe stanje in konservatorsko-restavratorske posege od druge polovice 20. stoletja ter predlaga utrditev zidov gradu in pristave, nove točkovne posege in umestitev programa v prostor razvaline.","Na terasah dveh nekdanjih gospodarskih poslopij stoji manjši raziskovalni center za analizo terenskih vzorcev alpskih vodotokov. Ustvarja novo povezavo med spodnjim in zgornjim delom razvaline in izboljšuje njeno dostopnost. V pristavi, kjer je bil nekoč mlin, sta vhod in kavarna. Park in prireditveni prostor dopolnjujeta revitalizacijo."]},

 {id:"thlagong",tags:["built"],kind:"built",cover:"02-photo",

  mentors:"Prof. Anja Planišček, MA; Assoc. Prof. Gašper Medvešek; Assoc. Prof. Tomaž Slak, PhD; Assist. Primož Žitnik; Assist. Mina Hiršman; Teaching Assoc. Tadej Bolta; Teaching Assoc. Samo Kralj",
  text:{en:["In the academic year 2022/2023, the Interactive Centre in the Waterberg Biosphere Reserve was designed as part of a hands-on architectural studio. It was built between January and April 2024 by students of the Faculty of Architecture, University of Ljubljana.","The project creates a community hub where local residents can gather, learn about the environment and move towards sustainable practices. The centre provides space for education, biodiversity awareness and local empowerment, and connects the stakeholders of the Waterberg District with the community directly affected by the project."],
        de:["Das interaktive Zentrum im Waterberg-Biosphärenreservat wurde im Studienjahr 2022/2023 in einem praxisorientierten Entwurfsstudio entworfen und von Januar bis April 2024 von Studierenden der Fakultät für Architektur der Universität Ljubljana gebaut.","Das Projekt schafft einen Treffpunkt, an dem die lokale Bevölkerung zusammenkommt, mehr über die Umwelt erfährt und den Wandel zu nachhaltigen Praktiken gestaltet. Das Zentrum bietet Raum für Bildung, Bewusstsein für Biodiversität und die Stärkung der lokalen Gemeinschaft und verbindet die Akteure im Waterberg-Distrikt mit der direkt betroffenen Gemeinde."],
        sl:["Interaktivni center v biosfernem rezervatu Waterberg je bil zasnovan v študijskem letu 2022/2023 v praktično usmerjenem arhitekturnem ateljeju, med januarjem in aprilom 2024 pa so ga zgradili študenti Fakultete za arhitekturo Univerze v Ljubljani.","Projekt ustvarja skupnostno središče, kjer se domačini zbirajo, spoznavajo okolje in prehajajo k trajnostnim praksam. Center ponuja prostor za izobraževanje, ozaveščanje o biotski raznovrstnosti in krepitev lokalne skupnosti ter povezuje deležnike v okrožju Waterberg s skupnostjo, ki jo projekt neposredno zadeva."]},
  role:{en:"Plans and details, 3D model and visualisation, exhibition, poster and brochure; construction on site with local materials (earth, timber and masonry).",de:"Pläne und Details, 3D-Modell und Visualisierung, Ausstellung, Plakat und Broschüre; Mitarbeit auf der Baustelle mit lokalen Baumaterialien (Erdbau, Holz- und Mauerwerksbau).",sl:"Načrti in detajli, 3D-model in vizualizacija, razstava, plakat in brošura; delo na gradbišču z lokalnimi materiali (zemlja, les in zidava)."},

 {id:"luzern",tags:["academic"],kind:"studio",cover:"04-model-facade",
  title:{en:"Hotel in Lucerne",de:"Hotel in Luzern",sl:"Hotel v Luzernu"},
  place:{en:"Lucerne, Switzerland",de:"Luzern, Schweiz",sl:"Luzern, Švica"},yearPlain:"2022/2023",
  context:{en:"Studio Meinrad Morger",de:"Studio Meinrad Morger",sl:"Atelje Meinrad Morger"},
  text:{en:["Lucerne lies on Lake Lucerne close to the Alps, and the main station is where most visitors arrive. Water is the core of the concept: it divides the city, while bridges connect it. Water guides visitors to the main entrance in the central gap between the buildings.","On the outer grid, new water columns supply fresh water and grey water and carry waste water down to the basement, where it is filtered and grey water is recovered. Bathrooms always sit at these columns, together with the entrance to each room. The structure follows a 4.98 × 4.98 m grid, ramps link the hotel with neighbouring buildings, and the water column on the south side also carries the facade greenery."],
        de:["Luzern liegt am Vierwaldstättersee in der Nähe der Alpen, der Hauptbahnhof ist der wichtigste Ankunftsort für Gäste. Hauptelement des Konzepts ist das Wasser: Es teilt die Stadt, die Brücken verbinden sie. Das Wasser führt die Besucher zum Haupteingang im mittleren Zwischenraum.","Am äußeren Raster stehen neue Wasserstützen, die Frisch- und Grauwasser zuführen und Schmutzwasser ins Untergeschoss leiten, wo es gefiltert und Grauwasser gewonnen wird. Bad und WC liegen immer an diesen Stützen, zusammen mit dem Zimmereingang. Das Tragwerk folgt einem Raster von 4,98 × 4,98 m, Rampen verbinden das Hotel mit den Nachbargebäuden, und die Wasserstütze an der Südseite dient auch der Begrünung der Fassade."],
        sl:["Luzern leži ob Štirikantonskem jezeru blizu Alp, glavna železniška postaja pa je osrednja točka prihoda obiskovalcev. Glavni element zasnove je voda: mesto deli, mostovi pa ga povezujejo. Voda vodi obiskovalce do glavnega vhoda v osrednjem vmesnem prostoru.","Na zunanjem rastru stojijo novi vodni stebri, ki dovajajo svežo in sivo vodo ter odvajajo odpadno vodo v klet, kjer se filtrira in pridobiva siva voda. Kopalnice so vedno ob teh stebrih, skupaj z vhodom v sobo. Konstrukcija sledi rastru 4,98 × 4,98 m, rampe povezujejo hotel s sosednjimi stavbami, vodni steber na južni strani pa nosi tudi ozelenitev fasade."]},
  images:[["04-model-facade",{en:"Working model: street facade",de:"Arbeitsmodell: Straßenfassade",sl:"Delovna maketa: ulična fasada"}],
          ["04-site",{en:"Site plan, 1:500",de:"Lageplan, M 1:500",sl:"Situacija, M 1:500"}],
          ["04-model-court",{en:"Working model: view into the courtyard",de:"Arbeitsmodell: Blick in den Innenhof",sl:"Delovna maketa: pogled na notranje dvorišče"}]]},

 {id:"sestica",tags:["academic"],kind:"studio",cover:"06-render",
  title:{en:"The New Chapter: City Library in the Šestica Block",de:"Das neue Kapitel: Die Stadtbibliothek im Karree Šestica",sl:"Novo poglavje: Mestna knjižnica v kareju Šestica"},
  place:{en:"Ljubljana, Slovenia",de:"Ljubljana, Slowenien",sl:"Ljubljana, Slovenija"},yearPlain:"2020/2021",
  context:{en:"Studio Rok Žnidaršič",de:"Studio Rok Žnidaršič",sl:"Atelje Rok Žnidaršič"},
  text:{en:["The scenario develops a new spatial order after a potential earthquake in the Šestica block in central Ljubljana, between Slovenska and Nazorjeva streets. The listed facades on Slovenska Street, of the Šestica inn, the house of the former Piccoli pharmacy and the Cocconi Palace, are replicated and shifted inwards to form new outdoor atria.","Each atrium has its own purpose: an exhibition atrium on Nazorjeva Street, an atrium with café and bookshop, and a public courtyard facing the Nebotičnik. Together they link the historic elements with an expanded city library, with 12,000 m² for books and 3,000 m² for activities, conceived as a multifunctional cultural centre."],
        de:["Das Szenario entwickelt nach einem möglichen Erdbeben eine neue räumliche Ordnung im Karree Šestica im Zentrum Ljubljanas, zwischen Slovenska- und Nazorjeva-Straße. Die denkmalgeschützten Fassaden an der Slovenska-Straße, des Wirtshauses Šestica, des Hauses der ehemaligen Piccoli-Apotheke und des Cocconi-Palasts, werden als Repliken nach innen versetzt und bilden neue Außenatrien.","Jedes Atrium hat einen eigenen Zweck: ein Atrium mit Ausstellungscharakter an der Nazorjeva-Straße, ein Atrium mit Kaffeehaus und Buchhandlung sowie ein öffentlicher Hof gegenüber dem Nebotičnik. Gemeinsam verbinden sie die historischen Elemente mit einer erweiterten Stadtbibliothek mit 12.000 m² für Bücher und 3.000 m² für Aktivitäten, als multifunktionales Kulturzentrum."],
        sl:["Scenarij po morebitnem potresu razvije nov prostorski red v kareju Šestica v središču Ljubljane, med Slovensko in Nazorjevo ulico. Zaščitene fasade ob Slovenski cesti, gostilne Šestica, hiše nekdanje lekarne Piccoli in Cocconijeve palače, so kot replike zamaknjene navznoter in tvorijo nove zunanje atrije.","Vsak atrij ima svoj namen: atrij z razstavnim značajem ob Nazorjevi ulici, atrij s kavarno in knjigarno ter javno dvorišče nasproti Nebotičnika. Skupaj povezujejo zgodovinske elemente z razširjeno mestno knjižnico z 12.000 m² za knjige in 3.000 m² za dejavnosti, zasnovano kot večnamensko kulturno središče."]},
  images:[["06-render",{en:"Visualisation of an atrium",de:"Visualisierung eines Atriums",sl:"Vizualizacija atrija"}],
          ["06-site",{en:"Site plan, 1:1000",de:"Lageplan, M 1:1000",sl:"Situacija, M 1:1000"}],
          ["06-elevations",{en:"West elevation, 1:1000",de:"Ansicht West, M 1:1000",sl:"Zahodna fasada, M 1:1000"}]]},
 {id:"roof",tags:["academic"],kind:"studio",cover:"07-model",
  title:{en:"A Roof for the World Ecology Congress 2026",de:"Das Dach für den Weltökologiekongress 2026",sl:"Streha za svetovni ekološki kongres 2026"},
  place:{en:"Rakova Jelša, Ljubljana, Slovenia",de:"Rakova Jelša, Ljubljana, Slowenien",sl:"Rakova Jelša, Ljubljana, Slovenija"},yearPlain:"2020/2021",
  context:{en:"Architectural Design 3 and Construction 2",de:"Architektonisches Entwerfen 3 und Konstruktion 2",sl:"Arhitekturno oblikovanje 3 in Konstrukcije 2"},
  team:"Lucija Ritoša, Tamara Zalokar, Saša Alekseja Zepan",
  text:{en:["The site lies in a wetland near Rakova Jelša, where an existing path leads into an untouched area in which trees form covered and open, larger and smaller spaces. A monumental rammed-earth wall invites visitors in and leads them to the central covered space, which serves as an auditorium. The walls follow the existing lines of the ground and define more and less intimate spaces between the trees.","The roof, made of cardboard tubes and wax paper in a steel frame, keeps its distance from the walls so that it seems to float, and lets dappled light through. Natural and recycled materials were chosen throughout. After the congress, the roof is taken away and recycled. Only the footprint of the walls remains, slowly washed back into the ground by the rain."],
        de:["Das Grundstück liegt in einem Feuchtgebiet bei Rakova Jelša. Ein bestehender Weg führt in ein unberührtes Gebiet, in dem Bäume gedeckte und ungedeckte, größere und kleinere Räume bilden. Eine monumentale Stampflehmmauer lädt ein und führt zum zentralen überdachten Raum, der als Auditorium dient. Die Wände folgen den vorhandenen Bodenlinien und definieren zwischen den Bäumen intime und weniger intime Räume.","Das Dach aus Papphülsen und Wachspapier in einem Stahlrahmen hält Abstand zu den Wänden, wirkt dadurch schwebend und lässt gefiltertes Licht durch. Es wurden vorwiegend natürliche und recycelte Materialien gewählt. Nach dem Kongress wird das Dach abtransportiert und wiederverwertet. Nur der Fußabdruck der Wände bleibt zurück und wird vom Regen langsam in den Boden zurückgespült."],
        sl:["Zemljišče leži na mokrišču pri Rakovi Jelši, kjer obstoječa pot vodi v nedotaknjeno območje, v katerem drevesa tvorijo pokrite in odprte, večje in manjše prostore. Monumentalni zid iz nabite zemlje vabi obiskovalce in jih vodi do osrednjega pokritega prostora, ki služi kot avditorij. Zidovi sledijo obstoječim linijam terena in med drevesi oblikujejo bolj in manj intimne prostore.","Streha iz kartonskih tulcev in voščenega papirja v jekleni konstrukciji se ne dotika zidov, zato deluje lebdeče, in prepušča razpršeno svetlobo. Izbrani so bili predvsem naravni in reciklirani materiali. Po kongresu streho odstranijo in reciklirajo. Ostane le odtis zidov, ki ga dež počasi spere nazaj v zemljo."]},
  images:[["07-model",{en:"Model",de:"Modell",sl:"Maketa"}],
          ["07-render-roof",{en:"Visualisation: under the roof",de:"Visualisierung: unter dem Dach",sl:"Vizualizacija: pod streho"}],
          ["07-render-wall",{en:"Visualisation: along the rammed-earth wall",de:"Visualisierung: entlang der Stampflehmmauer",sl:"Vizualizacija: ob zidu iz nabite zemlje"}]]}
];

function revealContact(root=document){
  root.querySelectorAll("[data-reveal]").forEach(el=>{
    if(el.dataset.done)return;el.dataset.done="1";
    const kind=el.dataset.reveal;
    if(kind==="email"){el.textContent=CT.mail();el.addEventListener("pointerdown",()=>el.href="mai"+"lto:"+CT.mail());el.addEventListener("focus",()=>el.href="mai"+"lto:"+CT.mail());el.addEventListener("click",()=>{el.href="mai"+"lto:"+CT.mail();});}

    lock.style.opacity=fe;
    mark.style.opacity=fe;
    mark.style.transform=fe>=1?"":`scale(${.6+.4*fe}) rotate(${-90*(1-fe)}deg)`;
    lock.classList.toggle("show",fe>.98);lock.inert=!(fe>.98);
  }
  const goalNow=()=>{const S0=startAt(geo(),targets());return Math.min(1,Math.max(0,(scrollY-S0)/DIST));};
  function tick(){
    const goal=goalNow();
    cur+=(goal-cur)*.12;
    if(Math.abs(goal-cur)<.0015) cur=goal;
    apply(cur);
    if(cur!==goal) requestAnimationFrame(tick); else running=false;
  }
  function onScroll(){
    if(reduce.matches){const on=scrollY>h1.offsetTop+h1.offsetHeight;lock.classList.toggle("show",on);lock.inert=!on;lock.style.opacity=on?1:0;mark.style.opacity=on?1:0;return;}
    if(!running){running=true;requestAnimationFrame(tick)}
  }
  function refresh(){if(reduce.matches)onScroll();else{cur=goalNow();apply(cur);}}
  addEventListener("scroll",onScroll,{passive:true});
  addEventListener("resize",refresh);
  if(window.ResizeObserver) new ResizeObserver(()=>requestAnimationFrame(refresh)).observe(h1);
  refresh();
  if(document.fonts){document.fonts.ready.then(refresh);document.fonts.addEventListener&&document.fonts.addEventListener("loadingdone",refresh);}
})();

/* Header + active nav */
const header=document.getElementById("header");
addEventListener("scroll",()=>header.classList.toggle("scrolled",scrollY>8),{passive:true});
const links=[...document.querySelectorAll("nav a")];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.hash==="#"+e.target.id?a.setAttribute("aria-current","location"):a.removeAttribute("aria-current"))}),{rootMargin:"-45% 0px -50% 0px"});
["work","about","contact"].forEach(id=>io.observe(document.getElementById(id)));
</script>
