<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tamara Zalokar</title>
    <meta name="description" content="Personal site of Tamara Zalokar." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #595959;
        --accent: #0b5fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #ededed;
          --muted: #a3a3a3;
          --accent: #7aa2ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 38rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }

      nav a {
        color: var(--accent);
        text-decoration: none;
        margin-right: 1.25rem;
      }

      nav a:hover,
      nav a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tamara Zalokar</h1>
      <p>Site under construction.</p>
      <nav>
        <a href="mailto:hello@example.com">Email</a>
        <a href="https://github.com/tamara-zalokar">GitHub</a>
      </nav>
    </main>
  </body>
</html>
